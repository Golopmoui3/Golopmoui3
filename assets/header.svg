            </stop>
            <stop offset="50%" stop-color="#7952e4">
                <animate attributeName="stop-color" values="#7952e4;#ff007f;#00ced1;#00f7f7;#7952e4" dur="8s" repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#ff007f">
                <animate attributeName="stop-color" values="#ff007f;#00ced1;#00f7f7;#7952e4;#ff007f" dur="8s" repeatCount="indefinite" />
            </stop>
        </linearGradient>
    </defs>

    <rect width="854" height="200" fill="#0d1117" />

    <g>
        <path fill="url(#gradientWave)" opacity="0.45">
            <animate attributeName="d" dur="10s" repeatCount="indefinite" keyTimes="0;0.333;0.667;1"
                calcMode="spline" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1" begin="0s"
                values="M0 0 L 0 120 Q 213.5 160 427 130 T 854 155 L 854 0 Z;
                        M0 0 L 0 145 Q 213.5 160 427 140 T 854 130 L 854 0 Z;
                        M0 0 L 0 165 Q 213.5 135 427 165 T 854 130 L 854 0 Z;
                        M0 0 L 0 120 Q 213.5 160 427 130 T 854 155 L 854 0 Z" />
        </path>
        <path fill="url(#gradientWave)" opacity="0.45">
            <animate attributeName="d" dur="10s" repeatCount="indefinite" keyTimes="0;0.333;0.667;1"
                calcMode="spline" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1" begin="-5s"
                values="M0 0 L 0 135 Q 213.5 180 427 150 T 854 160 L 854 0 Z;
                        M0 0 L 0 150 Q 213.5 120 427 120 T 854 140 L 854 0 Z;
                        M0 0 L 0 145 Q 213.5 125 427 150 T 854 165 L 854 0 Z;
                        M0 0 L 0 135 Q 213.5 180 427 150 T 854 160 L 854 0 Z" />
        </path>
    </g>

    <text x="50%" y="42%" class="title">Golopmoui3</text>
    <text x="50%" y="68%" class="desc">bug hunter  ·  AI infra  ·  mods &amp; games  ·  open source</text>
