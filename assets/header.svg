<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="200" viewBox="0 0 854 200">
    <style>
        .title {
            font-size: 64px;
            font-weight: 800;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            fill: #ffffff;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .desc {
            font-size: 18px;
            font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            fill: #a5d6ff;
            text-anchor: middle;
            dominant-baseline: middle;
            letter-spacing: 1.5px;
        }
    </style>
    <defs>
        <linearGradient id="gradientWave" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f7f7">
